<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Ejercicio 21</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Ejercicio 21: Filtrar por Umbral</h1>
  <div class="enunciado">
    Escribe una función que tome un array de números y un valor, devolviendo un nuevo array con los números mayores que ese valor usando filter().
  </div>
  <div class="formulario">
    <input type="number" id="umbralInput" value="15" placeholder="Valor umbral">
    <button id="btnFiltrar">Filtrar Mayores</button>
  </div>
  <div id="resultado" class="resultado">El resultado aparecerá aquí.</div>
  <script src="script.js"></script>
</body>
</html>
