<body>
  <h1>Ejercicio 16: Conversión de Grados</h1>
  <div class="enunciado">
    Escribe una función que convierta grados Celsius a Fahrenheit usando la fórmula: Fahrenheit = (Celsius * 9/5) + 32.
  </div>
  <div class="formulario">
    <input type="number" id="celsiusInput" placeholder="Grados Celsius ºC">
    <button id="btnConvertir">Convertir</button>
  </div>
  <div id="resultado" class="resultado">El resultado aparecerá aquí.</div>
  <script src="script.js"></script>
