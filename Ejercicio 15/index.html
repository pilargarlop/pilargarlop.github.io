<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Ejercicio 15</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Ejercicio 15: Números Primos</h1>
  <div class="enunciado">
    Escribe un programa que imprima todos los números primos entre 1 y un número dado usando la función esPrimo(num).
  </div>
  <div class="formulario">
    <input type="number" id="numLimite" placeholder="Límite superior (ej. 30)">
    <button id="btnBuscar">Buscar Primos</button>
  </div>
  <div id="resultado" class="resultado">El resultado aparecerá aquí.</div>
  <script src="script.js"></script>
</body>
</html>
